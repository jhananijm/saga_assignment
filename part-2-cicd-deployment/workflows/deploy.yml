name: Deploy Application

on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push containers
        run: |
          echo "Build docker images and push to ACR with SHA tag"

      - name: Deploy Web/API to staging slot
        run: |
          echo "Deploy App Service staging slot"

      - name: Smoke test staging
        run: |
          echo "Run /health check against staging slot"

      - name: Swap staging to production
        run: |
          echo "Swap staging slot into production"

      - name: Deploy AKS workloads
        run: |
          echo "helm upgrade --install inference/workers"

  deploy-test:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to test environment
        run: |
          echo "Deploy same artifact to test"

  deploy-prod:
    if: github.event_name == 'release'
    needs: [ deploy-test ]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to prod environment (approval required)
        run: |
          echo "Deploy to production with rollback support"
